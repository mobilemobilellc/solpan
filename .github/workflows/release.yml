# .github/workflows/release.yml
name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate the upload against Google Play without committing it, creating a GitHub release or attesting
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
      APP_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}
      PLAY_TRACK: ${{ (contains(github.ref_name, '-alpha') && 'alpha') || (contains(github.ref_name, '-beta') && 'beta') || (contains(github.ref_name, '-test.') && 'internal') || 'production' }}

    steps:
      - name: Refuse a real release from a branch
        if: github.ref_type != 'tag' && inputs.dry_run != true
        run: |
          echo "::error::Real releases run from a v* tag; dispatch on a branch with dry_run."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Write Play release notes
        run: |
          APP_VERSION_NAME="${APP_VERSION_NAME#v}"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          mkdir -p app/src/main/play/release-notes/en-US
          .github/scripts/play-release-notes.sh "$APP_VERSION_NAME" | tee app/src/main/play/release-notes/en-US/default.txt

      - name: Decode Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build Release Artifacts (AAB and APK)
        run: ./gradlew :app:bundleRelease :app:assembleRelease -PappVersionName="$APP_VERSION_NAME" -PappVersionCode=${{ github.run_number }} --parallel --scan --no-configuration-cache
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Attach artifacts to the GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-test.') }}

      - name: Attest Build Provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'app/build/outputs/*/release/app-release.*'

      - name: Publish to Google Play
        run: >-
          ./gradlew :app:publishReleaseBundle
          --artifact-dir app/build/outputs/bundle/release
          --track "$PLAY_TRACK"
          --release-status completed
          --release-name "$APP_VERSION_NAME"
          ${{ env.DRY_RUN == 'true' && '--no-commit' || '' }}
          --no-configuration-cache
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
