# .github/workflows/build.yml
name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Run checks and build debug APK
        run: ./gradlew detekt spotlessCheck testDebugUnitTest :app:assembleDebug app:jacocoTestReport app:jacocoCoverageVerification --parallel --continue --scan

      - name: Validate Screenshot Tests
        run: ./gradlew :app:validateDebugScreenshotTest --parallel --continue --no-configuration-cache

      - name: Upload Screenshot Diffs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-diffs
          path: app/build/outputs/screenshotTest/debug/preview/diffs/
          if-no-files-found: ignore

      - name: Merge detekt SARIF from every module
        if: success() || failure()
        run: |
          python3 - <<'PY'
          import glob, json, pathlib, sys

          files = sorted(glob.glob('**/build/reports/detekt/detekt.sarif', recursive=True))
          if not files:
              sys.exit("no detekt SARIF found")

          merged = json.load(open(files[0]))
          baseline = [r.get('id') for r in merged['runs'][0]['tool']['driver'].get('rules', [])]
          results = []
          for f in files:
              doc = json.load(open(f))
              rules = [r.get('id') for r in doc['runs'][0]['tool']['driver'].get('rules', [])]
              # results carry a ruleIndex into this array, so merging is only safe while the
              # modules share one detekt config
              if rules != baseline:
                  sys.exit(f"{f} has a different rule set; cannot merge by index")
              for run in doc['runs']:
                  results.extend(run.get('results', []))

          merged['runs'] = [merged['runs'][0]]
          merged['runs'][0]['results'] = results
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/detekt-merged.sarif').write_text(json.dumps(merged))
          print(f"merged {len(files)} modules, {len(results)} results")
          PY

      - name: Upload SARIF to GitHub using the upload-sarif action
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: build/detekt-merged.sarif
          category: detekt

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: coverage-reports
          path: app/build/reports/jacoco/
          if-no-files-found: ignore

      - name: Comment Coverage Report
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request' && (success() || failure())
        with:
          script: |
            const fs = require('fs');
            const jacocoCsv = 'app/build/reports/jacoco/jacoco.csv';
            if (!fs.existsSync(jacocoCsv)) {
              core.warning(`No coverage report at ${jacocoCsv}`);
              return;
            }
            const rows = fs.readFileSync(jacocoCsv, 'utf8').trim().split('\n');
            if (rows.length < 2) {
              core.warning('Coverage report has no data rows');
              return;
            }
            const header = rows[0].split(',');
            const coveredAt = header.indexOf('LINE_COVERED');
            const missedAt = header.indexOf('LINE_MISSED');
            let covered = 0;
            let missed = 0;
            for (const row of rows.slice(1)) {
              const cells = row.split(',');
              covered += parseInt(cells[coveredAt], 10) || 0;
              missed += parseInt(cells[missedAt], 10) || 0;
            }
            const total = covered + missed;
            const coverage = total > 0 ? ((covered / total) * 100).toFixed(2) : '0.00';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Code Coverage Report\n\n📊 **Line Coverage: ${coverage}%**\n\n- Lines Covered: ${covered}\n- Lines Missed: ${missed}\n- Total Lines: ${total}`
            });

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Monitor APK Size
        run: |
          APK_SIZE=$(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')
          echo "## APK Size: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          
          # Track size in bytes for CI monitoring
          APK_BYTES=$(stat -f%z app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK_BYTES=$APK_BYTES" >> $GITHUB_ENV
          
          # Alert if APK grows beyond baseline (24MB, ~20% over the current 20.1MB)
          THRESHOLD_BYTES=$((24 * 1024 * 1024))
          if [ "$APK_BYTES" -gt "$THRESHOLD_BYTES" ]; then
            echo "⚠️ WARNING: APK size ($APK_BYTES bytes) exceeds baseline threshold ($THRESHOLD_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✓ APK size within acceptable bounds ($APK_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'app/build/outputs/apk/debug/app-debug.apk'
